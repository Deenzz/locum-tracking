<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Locum Ledger</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f7f8fc;--card:#fff;--fg:#1e2233;--mut:#7b8197;--line:#e6e8f0;--pri:#6656d9;--tint:#f0efff;--ok:#059669;--okb:#d1fae5;--wa:#b45309;--wab:#fef3c7;--bad:#e11d48;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11131b;--card:#171923;--fg:#eceef6;--mut:#9aa0b8;--line:#272a38;--tint:#232042;--ok:#34d399;--okb:#12392d;--wa:#fbbf24;--wab:#3d2f0c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11131b;--card:#171923;--fg:#eceef6;--mut:#9aa0b8;--line:#272a38;--tint:#232042;--ok:#34d399;--okb:#12392d;--wa:#fbbf24;--wab:#3d2f0c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:24px 20px 48px}
header{display:flex;align-items:center;gap:12px;margin-bottom:24px;flex-wrap:wrap}
.logo{width:42px;height:42px;border-radius:12px;background:var(--pri);color:#fff;display:grid;place-items:center;font-size:20px}
h1{font-size:20px;margin:0;letter-spacing:-.01em}
.sub{color:var(--mut);font-size:13px;margin:0}
.sp{flex:1}
button,select,input{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--card);padding:9px 14px;border-radius:12px;cursor:pointer;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--pri)}
.btn.p{background:var(--pri);border-color:var(--pri);color:#fff}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.lbl{font-size:12px;color:var(--mut);font-weight:600}
.big{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:6px}
.big.w{color:var(--wa)}.big.o{color:var(--ok)}
.grid{display:grid;grid-template-columns:1fr 1.5fr;gap:14px;margin-bottom:20px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
h2{font-size:15px;margin:0 0 14px}
form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
form label{font-size:12px;font-weight:600;color:var(--mut);display:block}
form .f{grid-column:1/-1}
form input,form select{width:100%;margin-top:4px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.bars{display:flex;align-items:flex-end;gap:10px;height:170px;border-bottom:1px solid var(--line)}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:6px;font-size:11px;color:var(--mut)}
.bar i{display:block;width:100%;max-width:44px;border-radius:8px 8px 0 0;background:var(--tint);min-height:3px}
.bar.cur i{background:var(--pri)}
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}.ch h2{margin:0}.bars{gap:5px}.bar{font-size:10px;min-width:0}.bar span{font-size:9px}
.tools{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.tools input{flex:1;min-width:160px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:720px}
th{text-align:left;font-size:12px;color:var(--mut);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:12px 10px;border-bottom:1px solid var(--line);font-size:14px}
td small{display:block;color:var(--mut);font-size:12px}
.chip{border:0;border-radius:99px;padding:4px 11px;font-size:12px;font-weight:700;cursor:pointer}
.chip.paid{background:var(--okb);color:var(--ok)}.chip.pend{background:var(--wab);color:var(--wa)}
.x{border:0;background:none;color:var(--mut);cursor:pointer;font-size:18px;padding:2px 8px}
.x:hover{color:var(--bad)}
.empty{text-align:center;color:var(--mut);padding:28px 0}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
@media print{header .btn,form,.tools,.x,#toast{display:none}body{background:#fff}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="logo" aria-hidden="true">✚</div>
  <div><h1>My Locum Ledger</h1><p class="sub">Track shifts, payments and what’s still owed to you.</p></div>
  <div class="sp"></div>
  <select id="cur" class="btn" aria-label="Currency"><option value="RM">RM</option><option value="$">$</option><option value="£">£</option><option value="S$">S$</option></select>
  <button class="btn" id="theme" aria-label="Toggle light or dark mode">◐ Theme</button>
  <button class="btn p" id="pdf">Save as PDF</button>
</header>

<section class="cards">
  <div class="card"><div class="lbl">Total earned</div><div class="big" id="tTotal">0</div></div>
  <div class="card"><div class="lbl">Received</div><div class="big o" id="tPaid">0</div></div>
  <div class="card"><div class="lbl">Still owed</div><div class="big w" id="tPend">0</div></div>
  <div class="card"><div class="lbl">Shifts · hours</div><div class="big" id="tCnt">0</div></div>
</section>

<section class="grid">
  <div class="card">
    <h2>Add a shift</h2>
    <form id="form">
      <label class="f">Clinic / hospital<input id="fac" required placeholder="e.g. Klinik Sentral"></label>
      <label>Date<input id="date" type="date" required></label>
      <label>Hours<input id="hrs" type="number" step="0.5" min="0" required placeholder="8"></label>
      <label>Hourly rate<input id="rate" type="number" step="0.01" min="0" required placeholder="40"></label>
      <label>Procedure incentive<input id="inc" type="number" step="0.01" min="0" placeholder="Optional, e.g. 40"></label>
      <label>Status<select id="st"><option value="pend">Awaiting payment</option><option value="paid">Paid</option></select></label>
      <button class="btn p f" type="submit">Save shift</button>
    </form>
  </div>
  <div class="card">
    <div class="ch"><h2>Earnings <span id="rangeTot" class="sub"></span></h2><select id="range" class="btn" aria-label="Chart range"></select></div>
    <div class="bars" id="bars"></div>
  </div>
</section>

<section class="card">
  <div class="tools"><input id="q" type="search" placeholder="Search by clinic or status" aria-label="Search shifts"></div>
  <div class="tw"><table>
    <thead><tr><th>Clinic &amp; date</th><th>Hours</th><th>Rate</th><th>Incentive</th><th>Total</th><th>Status</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
</section>
</div>
<div id="toast" role="status"></div>

<script>
(function(){
var KEY="locum-personal-v1",S={shifts:[],cur:"RM",theme:"",range:"12"};
try{var raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){}
var $=function(i){return document.getElementById(i)};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function money(n){return S.cur+" "+n.toLocaleString("en",{minimumFractionDigits:2,maximumFractionDigits:2})}
function tot(s){return s.hours*s.rate+(s.incentive||0)}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fmtDate(d){var x=new Date(d+"T00:00:00");return isNaN(x)?d:x.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}
function toast(m){var t=$("toast");t.textContent=m;t.className="on";setTimeout(function(){t.className=""},2200)}
function applyTheme(){if(S.theme)document.documentElement.setAttribute("data-theme",S.theme);else document.documentElement.removeAttribute("data-theme")}
function isDark(){return S.theme?S.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches}

function render(){
  $("cur").value=S.cur;
  var all=S.shifts.slice().sort(function(a,b){return b.date.localeCompare(a.date)});
  var sum=0,paid=0,hrs=0;
  all.forEach(function(s){var t=tot(s);sum+=t;hrs+=s.hours;if(s.status==="paid")paid+=t});
  $("tTotal").textContent=money(sum);$("tPaid").textContent=money(paid);$("tPend").textContent=money(sum-paid);
  $("tCnt").textContent=all.length+" · "+hrs+"h";
  var q=$("q").value.toLowerCase();
  var rows=all.filter(function(s){return (s.facility+" "+(s.status==="paid"?"paid":"awaiting payment")).toLowerCase().indexOf(q)>-1});
  $("rows").innerHTML=rows.length?rows.map(function(s){
    return '<tr><td>'+esc(s.facility)+'<small>'+fmtDate(s.date)+'</small></td><td>'+s.hours+'h</td><td>'+money(s.rate)+'</td><td>'+(s.incentive?money(s.incentive):'–')+'</td><td><b>'+money(tot(s))+'</b></td><td><button class="chip '+s.status+'" data-t="'+s.id+'" title="Click to change status">'+(s.status==="paid"?"Paid":"Awaiting")+'</button></td><td><button class="x" data-d="'+s.id+'" aria-label="Delete shift">×</button></td></tr>'
  }).join(""):'<tr><td colspan="7" class="empty">No shifts yet. Add your first one above.</td></tr>';
  var now=new Date(),m=[],i,ys={},cy=now.getFullYear();
  ys[cy]=1;S.shifts.forEach(function(s){ys[s.date.slice(0,4)]=1});
  var yrs=Object.keys(ys).sort().reverse();
  if(S.range!=="12"&&!ys[S.range])S.range="12";
  $("range").innerHTML='<option value="12">Last 12 months</option>'+yrs.map(function(y){return '<option value="'+y+'">Year '+y+'</option>'}).join("");
  $("range").value=S.range;
  if(S.range==="12"){for(i=11;i>=0;i--){var d=new Date(cy,now.getMonth()-i,1);m.push({k:d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"),n:d.toLocaleString("en",{month:"short"}),v:0})}}
  else{for(i=0;i<12;i++){m.push({k:S.range+"-"+String(i+1).padStart(2,"0"),n:new Date(2000,i,1).toLocaleString("en",{month:"short"}),v:0})}}
  var ck=cy+"-"+String(now.getMonth()+1).padStart(2,"0"),rt=0;
  S.shifts.forEach(function(s){m.forEach(function(b){if(s.date.slice(0,7)===b.k){b.v+=tot(s);rt+=tot(s)}})});
  $("rangeTot").textContent="· "+money(rt);
  var mx=Math.max.apply(null,m.map(function(b){return b.v}).concat([1]));
  function cmp(v){return v?(v>=1000?(v/1000).toFixed(1)+"k":String(Math.round(v))):""}
  $("bars").innerHTML=m.map(function(b){return '<div class="bar'+(b.k===ck?' cur':'')+'" title="'+b.n+' '+b.k.slice(0,4)+': '+money(b.v)+'"><span>'+cmp(b.v)+'</span><i style="height:'+(b.v/mx*120)+'px"></i>'+b.n+'</div>'}).join("");
}

$("form").addEventListener("submit",function(e){
  e.preventDefault();
  S.shifts.push({id:Date.now().toString(36),facility:$("fac").value.trim(),date:$("date").value,hours:+$("hrs").value,rate:+$("rate").value,incentive:+$("inc").value||0,status:$("st").value});
  save();render();e.target.reset();$("date").value=new Date().toISOString().slice(0,10);toast("Shift saved");
});
$("rows").addEventListener("click",function(e){
  var t=e.target.getAttribute("data-t"),d=e.target.getAttribute("data-d");
  if(t){S.shifts.forEach(function(s){if(s.id===t)s.status=s.status==="paid"?"pend":"paid"});save();render()}
  if(d&&confirm("Delete this shift?")){S.shifts=S.shifts.filter(function(s){return s.id!==d});save();render()}
});
$("q").addEventListener("input",render);
$("range").addEventListener("change",function(){S.range=this.value;save();render()});
$("cur").addEventListener("change",function(){S.cur=this.value;save();render()});
$("theme").addEventListener("click",function(){S.theme=isDark()?"light":"dark";applyTheme();save()});

$("pdf").addEventListener("click",async function(){
  if(!window.jspdf){window.print();return}
  var J=window.jspdf.jsPDF,doc=new J({unit:"pt",format:"a4"}),y=56,L=48,R=547;
  var all=S.shifts.slice().sort(function(a,b){return a.date.localeCompare(b.date)});
  var sum=0,paid=0;all.forEach(function(s){sum+=tot(s);if(s.status==="paid")paid+=tot(s)});
  function head(){doc.setFont("helvetica","bold");doc.setFontSize(9);doc.setTextColor(110);
    doc.text("CLINIC",L,y);doc.text("DATE",185,y);doc.text("HRS",255,y);doc.text("RATE",285,y);doc.text("INCENTIVE",350,y);doc.text("TOTAL",425,y);doc.text("STATUS",R,y,{align:"right"});
    y+=6;doc.setDrawColor(200);doc.line(L,y,R,y);y+=16}
  doc.setFont("helvetica","bold");doc.setFontSize(20);doc.setTextColor(102,86,217);doc.text("Locum Payment Statement",L,y);y+=20;
  doc.setFont("helvetica","normal");doc.setFontSize(10);doc.setTextColor(110);doc.text("Generated "+new Date().toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"}),L,y);y+=30;
  doc.setTextColor(30);doc.setFontSize(11);
  doc.text("Total earned: "+money(sum),L,y);doc.text("Received: "+money(paid),230,y);doc.text("Still owed: "+money(sum-paid),400,y);y+=32;
  head();
  doc.setFont("helvetica","normal");doc.setFontSize(10);
  all.forEach(function(s){
    if(y>780){doc.addPage();y=56;head();doc.setFont("helvetica","normal");doc.setFontSize(10)}
    doc.setTextColor(30);doc.text(doc.splitTextToSize(s.facility,130)[0],L,y);doc.text(fmtDate(s.date),185,y);doc.text(String(s.hours),255,y);doc.text(money(s.rate),285,y);doc.text(s.incentive?money(s.incentive):"-",350,y);doc.text(money(tot(s)),425,y);
    doc.setTextColor(s.status==="paid"?5:180,s.status==="paid"?150:83,s.status==="paid"?105:9);doc.text(s.status==="paid"?"Paid":"Awaiting",R,y,{align:"right"});y+=22});
  if(!all.length)doc.text("No shifts recorded.",L,y);
  var blob=doc.output("blob"),name="locum-statement-"+new Date().toISOString().slice(0,10)+".pdf";
  try{var dl=window.claude&&await window.claude.use("downloads");
    if(dl){await dl.save({filename:name,data:blob});toast("PDF ready");return}}catch(err){if(err&&err.code==="declined")return}
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();
});

$("date").value=new Date().toISOString().slice(0,10);
applyTheme();render();
})();
</script>
</body>
</html>
